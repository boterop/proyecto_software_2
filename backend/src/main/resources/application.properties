server.servlet.context-path=/api
spring.application.name=software
spring.datasource.url=jdbc:sqlite:../data/uqdelivery.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
app.security.jwt.secret=VGhpc0lzQURldmVsb3BtZW50U2VjcmV0S2V5MzJCeXRlcw==
app.security.jwt.expiration-minutes=60
logging.level.org.springframework.security=TRACE

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_TOKEN}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

